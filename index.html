<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎉 BrainrotRain Control</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .control-panel {
      background: rgba(0, 0, 0, 0.5);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      text-align: center;
    }

    h1 {
      margin-bottom: 1rem;
    }

    button {
      background: #00b4db;
      border: none;
      padding: 0.7rem 1.2rem;
      margin: 0.4rem;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0083b0;
    }

    input {
      padding: 0.5rem;
      border-radius: 6px;
      margin: 0.5rem;
      border: none;
      width: 60px;
      text-align: center;
    }

    label {
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="control-panel">
    <h1>🎉 BrainrotRain Control<br>A cool site that demonstrates the <a href="https://github.com/pcdelatara/brainrotRain.js">brainrotRain.js</a> library.</h1>
    <button onclick="br.start()">Start</button>
    <button onclick="br.stop()">Stop</button>
    <button onclick="br.clear()">Clear</button><br/>

    <label for="duration">Rain (s):</label>
    <input id="duration" type="number" min="1" value="5">
    <button onclick="br.rainFor(parseInt(document.getElementById('duration').value))">Rain!</button><br/>

    <label for="speed">Speed (ms):</label>
    <input id="speed" type="number" min="10" value="50">
    <button onclick="br.interval(parseInt(document.getElementById('speed').value))">Set Speed</button>
  </div>

  <!-- Load MemeRain library -->
  <script src="https://pcdelatara.github.io/brainrotRain.js/brainrotRain.js"></script>
</body>
</html>
